name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  gitleaks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks Secret Scan
        uses: zricethezav/gitleaks-action@v2
        with:
          config-path: gitleaks.toml
          verbose: true
          redact: true
          exit-zero: false

  trivy_fs_scan:
    runs-on: self-hosted
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy FS Scan
        run: trivy fs . --exit-code 0 --severity HIGH,CRITICAL         

  build_docker:
    runs-on: self-hosted
    needs: trivy_fs_scan
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: |
           docker rmi -f sampleapp:latest 
           docker build -t sampleapp:latest .

  save_tarball:
    runs-on: self-hosted
    needs: build_docker
    steps:
    - uses: actions/checkout@v4
    - name: Save Docker image as tarball
      run: docker save -o sampleapp.tar sampleapp:latest
    - name: Upload tarball
      uses: actions/upload-artifact@v4
      with:
        name: sampleapp-tar
        path: sampleapp.tar

  trivy_scan:
    runs-on: self-hosted
    needs: save_tarball
    steps:
    - uses: actions/checkout@v4
    - name: Download Docker tarball
      uses: actions/download-artifact@v4
      with:
        name: sampleapp-tar
        path: .
    - name: Run Trivy vulnerability scanner
      run: trivy image --input sampleapp.tar --exit-code 0 --severity HIGH,CRITICAL

  push_to_ecr:
    runs-on: self-hosted
    needs: trivy_scan
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Change to your region
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin <your_account_id>.dkr.ecr.us-east-1.amazonaws.com
      - name: Tag Docker image for ECR
        run: |
          docker tag sampleapp:latest <your_account_id>.dkr.ecr.us-east-1.amazonaws.com/sampleapp:latest
      - name: Push Docker image to ECR
        run: |
          docker push <your_account_id>.dkr.ecr.us-east-1.amazonaws.com/sampleapp:latest


  run_container:
    runs-on: self-hosted
    needs: trivy_scan
    steps:
      - uses: actions/checkout@v4
      - name: Run the Docker container
        run: |
          docker rm -f my_sample_app || true
          docker run -d --name my_sample_app -p 5000:5000 sampleapp:latest
