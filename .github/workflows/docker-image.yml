name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: |
        docker build -t sampleapp:latest .

    - name: Save image as tarball
      run: |
        sudo docker save -o sampleapp.tar sampleapp:latest

    - name: Run Trivy vulnerability scanner
      run: |
         sudo trivy image --input sampleapp.tar
        #sudo trivy image --input sampleapp.tar --exit-code 1 --severity HIGH,CRITICAL


    - name: Run the Docker container
      run: |
        sudo docker rm -f my_sample_app
        sudo docker run -d --name my_sample_app -p 5000:5000 sampleapp:latest
